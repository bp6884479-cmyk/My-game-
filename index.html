function logo3d(){
var host=document.getElementById("ctpLogo3d");if(!host)return;
var TH=window.THREE;

R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.setClearColor(0x000000,0);

var sc=new TH.Scene(),cam=new TH.PerspectiveCamera(40,1.55,.1,50);cam.position.set(0,0,6.2);

function mkTex(w,h,fn){var c=document.createElement("canvas");c.width=w;c.height=h;var t=new TH.CanvasTexture(c);t.anisotropy=4;return{c:c,x:c.getContext("2d"),t:t}}
function glowTex(col){var c=document.createElement("canvas");c.width=c.height=128;var x=c.getContext("2d"),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,col+"ff");g.addColorStop(.35,col+"66");g.addColorStop(1,col+"00");x.fillStyle=g;x.fillRect(0,0,128,128);return new TH.CanvasTexture(c)}

var W=768,H=384;
function drawText(x,mode,sh){
x.clearRect(0,0,W,H);x.textAlign="center";x.textBaseline="middle";
x.font="900 150px system-ui,Arial,sans-serif";
if(mode==="back"){x.fillStyle="#7a4a00";x.fillText("COLOUR",W/2,112)}
else{var g=x.createLinearGradient(0,40,0,185);g.addColorStop(0,"#fff7b8");g.addColorStop(.45,"#ffd23f");g.addColorStop(1,"#e8890a");x.fillStyle=g;x.fillText("COLOUR",W/2,112);x.lineWidth=3;x.strokeStyle="rgba(120,60,0,.55)";x.strokeText("COLOUR",W/2,112)}

if(mode!=="back"){

var cols=[0xff3b3b,0x2ee06a,0xa855f7],hex=["#ff3b3b","#2ee06a","#a855f7"],orbs=[];
for(var k=0;k<3;k++){var o=new TH.Group();var b=new TH.Mesh(new TH.SphereGeometry(.24,32,24),new TH.MeshStandardMaterial({color:cols[k],emissive:cols[k],emissiveIntensity:.7,metalness:.3,roughness:.2}));o.add(b);var gl=new TH.Sprite(new TH.SpriteMaterial({map:glowTex(hex[k]),transparent:true,blending:TH.AdditiveBlending,depthWrite:false}));gl.scale.set(1.5,1.5,1);o.add(gl);ring.add(o);orbs.push(o)}

var NP=90,pg=new TH.BufferGeometry(),pa=new Float32Array(NP*3);
for(var j=0;j<NP;j++){pa[j*3]=(Math.random()-.5)*7;pa[j*3+1]=(Math.random()-.5)*3.6;pa[j*3+2]=(Math.random()-.5)*3}
pg.setAttribute("position",new TH.BufferAttribute(pa,3));
var pts=new TH.Points(pg,new TH.PointsMaterial({color:0xffe08a,size:.06,transparent:true,opacity:.85,blending:TH.AdditiveBlending,depthWrite:false}));sc.add(pts);

cx+=(mx-cx)*.06;cy+=(my-cy)*.06;
grp.rotation.y=Math.sin(t*.7)*.32+cx*.35;grp.rotation.x=Math.sin(t*.5)*.07+cy*.18;grp.position.y=Math.sin(t*1.3)*.07;

R.render(sc,cam)}
